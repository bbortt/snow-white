receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug/basic:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 10
  file:
    path: /data/traces.json
    format: json
    rotation:
      max_megabytes: 100
      max_backups: 100

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug/basic, file]
