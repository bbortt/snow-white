openapi: 3.1.2
info:
  title: Report Coordinator API
  description: A gateway service dispatching jobs for all microservice. A single entrypoint into the system for all user interfaces.
  version: 1.0.0
  x-api-name: report
  x-service-name: report-coordinator-api
paths:
  /api/rest/v1/reports:
    get:
      operationId: listQualityGateReports
      summary: 'List all Quality-Gate Reports'
      description: 'Returns a paginated list of all Quality-Gate Reports'
      tags:
        - report
      parameters:
        - name: page
          in: query
          description: 'Page number (0-based index)'
          required: false
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          description: 'Number of items per page'
          required: false
          schema:
            type: integer
            minimum: 1
        - name: sort
          in: query
          description: >-
            Sorting criteria in the format: property,(asc|desc). One of calculationId, initiatedAt,
            qualityGateConfigName; any other property or a malformed value is rejected with 400.
            Defaults to initiatedAt,desc. Every order is completed by calculationId, so paging is
            reproducible. Reports cannot be sorted by status: it is published as a name but stored
            as a stable code, and that code's order is not a sequence these names imply.
          required: false
          schema:
            type: string
            example: initiatedAt,desc
        - name: serviceName
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: 'Filter results to reports including APIs belonging to this service name (combine with apiName for cascading)'
        - name: apiName
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: 'Filter results to reports including APIs with this API name (combine with serviceName for cascading)'
        - name: apiVersion
          in: query
          required: false
          schema:
            type: string
            maxLength: 16
          description: 'Filter results to reports including APIs with this API version'
      responses:
        '200':
          description: 'Paginated list of Quality-Gate Reports'
          headers:
            X-Total-Count:
              description: 'Total number of Quality-Gate Reports available'
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/QualityGateReport.yml'
        '400':
          description: 'The sort parameter names a property this listing cannot order by, or does not parse'
          content:
            application/json:
              schema:
                $ref: './components/Error.yml'
        '500':
          description: 'Internal server error'
          content:
            application/json:
              schema:
                $ref: './components/Error.yml'

  /api/rest/v1/reports/{calculationId}:
    get:
      operationId: getReportByCalculationId
      summary: 'Get Quality-Gate calculation reports'
      description: 'Retrieves the status and reports of an asynchronous Quality-Gate calculation'
      tags:
        - report
      parameters:
        - name: calculationId
          in: path
          description: 'The UUID of the calculation job returned from the POST request'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Quality-Gate calculation completed successfully'
          content:
            application/json:
              schema:
                $ref: './components/QualityGateReportWithFindings.yml'
        # The 202 keeps './components/QualityGateReport.yml' for the same reason the JUnit
        # endpoint's does: this is the calculation's poll, and an empty 'findings' on a result that
        # has reported would claim the criterion found nothing where it only has not been loaded.
        '202':
          description: 'Calculation is still in progress'
          content:
            application/json:
              schema:
                $ref: './components/QualityGateReport.yml'
        '404':
          description: 'Calculation ID not found'
          content:
            application/json:
              schema:
                $ref: './components/Error.yml'
        '500':
          description: 'Internal server error'
          content:
            application/json:
              schema:
                $ref: './components/Error.yml'
  # The JUnit endpoint keeps './components/QualityGateReport.yml' on its 202: it is a CI poll
  # awaiting XML, and findings would make every poll load the evidence table for a body nobody
  # reads.
  /api/rest/v1/reports/{calculationId}/junit:
    get:
      operationId: getReportByCalculationIdAsJUnit
      summary: 'Get Quality-Gate report in JUnit XML format'
      description: 'Retrieves the status and results of an asynchronous Quality-Gate calculation formatted as JUnit XML'
      tags:
        - report
      parameters:
        - name: calculationId
          in: path
          description: 'The UUID of the calculation job returned from the POST request'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Quality-Gate calculation completed successfully'
          content:
            application/xml:
              schema:
                type: string
                format: binary
        '202':
          description: 'Calculation is still in progress'
          content:
            application/json:
              schema:
                $ref: './components/QualityGateReport.yml'
        '404':
          description: 'Calculation ID not found'
          content:
            application/json:
              schema:
                $ref: './components/Error.yml'
        '500':
          description: 'Internal server error'
          content:
            application/json:
              schema:
                $ref: './components/Error.yml'
