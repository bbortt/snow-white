type: object
required:
  - status
  - specPointer
  - evidence
properties:
  status:
    type: string
    description: 'What the criterion concluded about this target'
    example: COVERED
    enum:
      - COVERED
      - UNCOVERED
      - NOT_APPLICABLE
  specPointer:
    type: string
    description: 'RFC 6901 JSON Pointer into the analyzed OpenAPI document, resolving to the node the criterion judged'
    example: '/paths/~1pung~1{message}/get/responses/404'
    minLength: 1
    maxLength: 512
  httpPath:
    type: string
    description: 'The path of the judged target, as the specification spells it - null where the target has no path dimension'
    example: '/pung/{message}'
    maxLength: 256
  httpMethod:
    type: string
    description: 'The method of the judged target - null where the target has no method dimension'
    example: GET
    maxLength: 16
  responseCode:
    type: string
    description: 'The response code judged - null where the target has no response-code dimension'
    example: '404'
    maxLength: 16
  parameterName:
    type: string
    description: 'The name of the judged parameter - null where the target is not a parameter'
    example: page
    maxLength: 256
  contentType:
    type: string
    description: 'The judged content type - null where the target has no content-type dimension'
    example: application/json
    maxLength: 128
  evidence:
    type: array
    description: 'The traces that evidence this finding - empty for anything but a covered one'
    items:
      $ref: './FindingEvidence.yml'
