openapi: 3.1.2
info:
  title: Quality Gate API
  description: A microservice for managing API Quality-Gate Configurations
  version: 1.0.0
  x-api-name: quality-gate
  x-service-name: quality-gate-api
paths:
  /api/rest/v1/quality-gates:
    get:
      operationId: getAllQualityGates
      summary: Retrieve all Quality-Gate Configurations
      description: Returns a list of all available Quality-Gate Configurations
      tags:
        - quality-gate
      parameters:
        - name: page
          in: query
          description: 'Page number (0-based index)'
          required: false
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          description: 'Number of items per page'
          required: false
          schema:
            type: integer
            minimum: 1
        - name: sort
          in: query
          description: >-
            Sorting criteria in the format: property,(asc|desc). One of isPredefined,
            minCoveragePercentage, name; any other property or a malformed value is rejected with
            400. Defaults to name,asc. Every order is completed by name, which is unique, so paging
            is reproducible.
          required: false
          schema:
            type: string
            example: name,asc
      responses:
        '200':
          description: A list of Quality-Gate Configurations
          headers:
            X-Total-Count:
              description: 'Total number of Quality-Gate Configurations available'
              schema:
                type: integer
            X-Quality-Gate-Ownership:
              $ref: '#/components/headers/QualityGateOwnership'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QualityGateConfig'
        '400':
          description: 'The sort parameter names a property this listing cannot order by, or does not parse'
          headers:
            X-Quality-Gate-Ownership:
              $ref: '#/components/headers/QualityGateOwnership'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createQualityGate
      summary: Create a new Quality-Gate Configuration
      description: Creates a new Quality-Gate Configuration with specified criteria
      tags:
        - quality-gate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityGateConfig'
      responses:
        '201':
          description: Configuration created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityGateConfig'
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
              description: URI to the newly created Quality-Gate Configuration
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Either the configuration name already exists, or this instance's gates are file-owned
            and the API cannot write them. The two are told apart by the error body's code:
            GATES_ARE_FILE_OWNED for the latter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/rest/v1/quality-gates/{name}:
    get:
      operationId: getQualityGateByName
      summary: Retrieve a specific Quality-Gate Configuration
      description: Returns a Quality-Gate Configuration by name
      tags:
        - quality-gate
      parameters:
        - name: name
          in: path
          description: Name of the Quality-Gate Configuration to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quality gate configuration
          headers:
            X-Quality-Gate-Ownership:
              $ref: '#/components/headers/QualityGateOwnership'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityGateConfig'
        '404':
          description: Configuration not found
          headers:
            X-Quality-Gate-Ownership:
              $ref: '#/components/headers/QualityGateOwnership'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateQualityGate
      summary: Update a Quality-Gate Configuration
      description: Updates an existing Quality-Gate Configuration
      tags:
        - quality-gate
      parameters:
        - name: name
          in: path
          description: Name of the Quality-Gate Configuration to update
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityGateConfig'
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityGateConfig'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            This instance's gates are file-owned and the API cannot write them. The error body's
            code is GATES_ARE_FILE_OWNED. Returned before the named gate is looked up, so an
            unknown name earns this rather than a 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteQualityGate
      summary: Delete a Quality-Gate Configuration
      description: Deletes a Quality-Gate Configuration by name
      tags:
        - quality-gate
      parameters:
        - name: name
          in: path
          description: Name of the Quality-Gate Configuration to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Configuration deleted successfully
        '404':
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            This instance's gates are file-owned and the API cannot write them. The error body's
            code is GATES_ARE_FILE_OWNED. Returned before the named gate is looked up, so an
            unknown name earns this rather than a 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  headers:
    QualityGateOwnership:
      description: >-
        Who owns this instance's Quality-Gates, on every response to a gate read. "database" means
        they are owned through this API, which is the behaviour of an instance deployed without a
        gate file. "file" means they come from the instance's gate file, so every write on a gate
        path answers 409. "file-empty" means the same and that the file defines no gates, which is
        what tells a 404 for a gate name apart from a name that is merely absent from a non-empty
        file. A client that reads none of these is unaffected.
      schema:
        type: string
        enum:
          - database
          - file
          - file-empty
        example: database
  schemas:
    QualityGateConfig:
      type: object
      required:
        - name
        - isPredefined
        - minCoveragePercentage
        - openApiCoverageCriteria
      properties:
        name:
          type: string
          description: Unique name for the Quality-Gate Configuration
          example: 'basic-coverage'
          minLength: 1
          maxLength: 64
        description:
          type: string
          description: Optional description of the Quality-Gate Configuration
          example: 'Basic coverage criteria for API testing'
          maxLength: 256
        isPredefined:
          type: boolean
          description: Whether the Quality-Gate Configuration is predefined or not
          default: false
        minCoveragePercentage:
          type: integer
          description: Minimum coverage percentage required for the quality gate to be treated as passed
          minimum: 80
          maximum: 100
          default: 100
          example: 100
        openApiCoverageCriteria:
          type: array
          description: List of OpenAPI criteria IDs used in this configuration
          items:
            type: string
            minLength: 1
            maxLength: 64
          example: ['PATH_COVERAGE']
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: 'INVALID_REQUEST'
        message:
          type: string
          example: 'Invalid request parameters'
