name: Deployments

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  publish-maven-packages:
    name: Publish Maven Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Build with Maven
        run: ./mvnw -B -b smart -T4C -DskipTests -Pprod -pl :commons,:annotation-api,:openapi-generator,:spring-web-autoconfiguration -am clean deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish-cli:
    name: Publish CLI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Extract Version from Tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Build with Maven
        run: ./mvnw -B -b smart -T4C -DskipTests -Pprod -pl :cli -am clean install
      - name: Upload CLI Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$REF_NAME" toolkit/cli/target/snow-white-linux-arm64
          gh release upload "$REF_NAME" toolkit/cli/target/snow-white-linux-x64
          gh release upload "$REF_NAME" toolkit/cli/target/snow-white-macos-arm64
          gh release upload "$REF_NAME" toolkit/cli/target/snow-white-macos-x64
          gh release upload "$REF_NAME" toolkit/cli/target/snow-white-windows-x64.exe
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build CLI Image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker build \
            -f "toolkit/cli/Dockerfile" \
            -t "ghcr.io/bbortt/snow-white/toolkit/cli:$VERSION" \
            --build-arg BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --build-arg PROJECT_VERSION="$VERSION" \
            --push \
            "toolkit/cli"
  publish-helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Extract Version from Tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: 'pnpm'
          node-version: '24'
      - name: Install Dependencies
        run: pnpm install
        working-directory: 'helm'
      - name: Bump Chart appVersion
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: npx --no-install ts-node scripts/bump-chart-version.ts "$VERSION"
        working-directory: 'helm'
      - name: Add Helm Repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add influxdata https://helm.influxdata.com
          helm repo add kafbat-ui https://kafbat.github.io/helm-charts
      - name: Git Configuration
        run: |
          git config user.name "Timon Borter"
          git config user.email "timon.borter@gmx.ch"
      - name: Release Helm Chart
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f
        env:
          CR_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        with:
          charts_dir: 'helm/charts'
  publish-images:
    name: Publish JDK-based Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: false
          submodules: true
      - name: Extract Version from Tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Build with Maven
        run: |
          ./mvnw -B clean install \
            -b smart -T4C \
            -Pprod \
            -DskipTests \
            -Dfrontend.test.skip=true \
            -pl :api-gateway,:api-sync-job,:openapi-coverage-stream -am
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build JDK Images
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: .github/scripts/build-oci-images.sh "$VERSION" "ghcr.io" "--push"
  publish-native-images:
    name: Publish Native Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          [
            api-index-api,
            otel-event-filter-stream,
            quality-gate-api,
            report-coordinator-api,
          ]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - name: Extract Version from Tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Build with Maven
        run: ./mvnw -B -b smart -T4C -DskipTests -Pprod -pl :${{ matrix.service }} -am clean install
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Native Image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ./mvnw -B spring-boot:build-image \
            -b smart -T4C \
            -Dimage.tag="$VERSION" \
            -DskipTests -Pnative,prod \
            -pl :${{ matrix.service }}
      - name: Push Native Image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: docker image push "ghcr.io/bbortt/snow-white/${{ matrix.service }}:$VERSION"
  attach-license-report:
    name: Attach License Report
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Build Maven License Report
        run: ./mvnw license:aggregate-add-third-party
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: 'pnpm'
          node-version: 24
      - name: Install Dependencies
        run: pnpm install
      - name: Build pnpm License Report
        run: pnpm licenses ls --prod --long > NODE_LICENSES.txt
      - name: Upload License Reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$REF_NAME" LICENSE
          gh release upload "$REF_NAME" MAVEN_LICENSES.txt
          gh release upload "$REF_NAME" NODE_LICENSES.txt
